<section class="homepage-aktuelles">

    <h2>Aktuelles</h2>

    {{ range first 3 (where site.RegularPages "Section" "aktuelles") }}

    <article class="article">

        <h3>{{ .Title }}</h3>

        <time datetime="{{ .Date.Format " 2006-01-02" }}">{{ .Date.Format "02.01.200" }}</time>

        <p>{{ .Summary }}</p>

        <a class="btn-primary" href="{{ .RelPermalink }}">Mehr erfahren</a>

    </article>

    {{ end }}

</section>
