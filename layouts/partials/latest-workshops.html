<section class="latest-three-posts">

    <h2>Workshops</h2>

    {{ range first 3 (where site.RegularPages "Section" "workshops") }}

    <article class="article">

        <h3>{{ .Title }}</h3>

        <time>{{ .Date.Format "02.01.2006" }}</time>

        <p>{{ .Summary }}</p>

        <a class="btn-primary" href="{{ .RelPermalink }}">Mehr erfahren</a>

    </article>

    {{ end }}

</section>
